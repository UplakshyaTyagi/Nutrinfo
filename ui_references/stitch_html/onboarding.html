<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nutrinfo Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed-variant": "#004c69",
                        "on-error-container": "#ffdad6",
                        "surface-bright": "#393939",
                        "surface": "#131313",
                        "secondary-fixed-dim": "#7ad0ff",
                        "on-error": "#690005",
                        "secondary-container": "#00bdfd",
                        "surface-container": "#201f1f",
                        "background": "#131313",
                        "on-secondary-container": "#004964",
                        "inverse-surface": "#e5e2e1",
                        "tertiary-fixed-dim": "#e6c26c",
                        "tertiary-fixed": "#ffdf95",
                        "primary-fixed": "#63ff93",
                        "tertiary-container": "#ffda81",
                        "outline": "#849584",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "on-primary": "#003917",
                        "on-secondary": "#003549",
                        "primary-fixed-dim": "#00e471",
                        "surface-variant": "#353534",
                        "surface-container-high": "#2a2a2a",
                        "on-primary-fixed-variant": "#005224",
                        "on-primary-fixed": "#00210b",
                        "on-surface": "#e5e2e1",
                        "surface-dim": "#131313",
                        "secondary-fixed": "#c3e8ff",
                        "on-tertiary": "#3e2e00",
                        "on-background": "#e5e2e1",
                        "on-tertiary-container": "#795e0f",
                        "surface-container-highest": "#353534",
                        "on-surface-variant": "#b9cbb8",
                        "on-tertiary-fixed-variant": "#594400",
                        "on-secondary-fixed": "#001e2c",
                        "outline-variant": "#3b4b3c",
                        "tertiary": "#fffaf6",
                        "primary": "#f0ffed",
                        "secondary": "#8bd5ff",
                        "primary-container": "#00ff7f",
                        "on-tertiary-fixed": "#251a00",
                        "surface-container-low": "#1c1b1b",
                        "inverse-primary": "#006d33",
                        "surface-tint": "#00e471",
                        "inverse-on-surface": "#313030",
                        "surface-container-lowest": "#0e0e0e",
                        "on-primary-container": "#007134"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        body {
            background-color: #131313;
            color: #e5e2e1;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-panel {
            background: rgba(42, 42, 42, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .selected-glow {
            box-shadow: 0 0 25px rgba(0, 255, 127, 0.25);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col overflow-hidden">
<!-- Top Navigation (Suppressing Standard Shell for Onboarding Focus) -->
<header class="fixed top-0 w-full z-50 px-8 py-8 flex flex-col items-center justify-center pointer-events-none">
<div class="mb-4">
<span class="text-xs font-label uppercase tracking-[0.2em] text-on-surface-variant opacity-60">Step 1 of 3</span>
</div>
<div class="w-16 h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="w-1/3 h-full bg-primary-container shadow-[0_0_10px_rgba(0,255,127,0.5)]"></div>
</div>
</header>
<!-- Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-24 pb-32 max-w-4xl mx-auto w-full">
<!-- Animated Entrance Wrapper -->
<div class="text-center mb-12">
<h1 class="font-headline text-4xl md:text-5xl font-extrabold tracking-tight text-on-surface mb-4">
                What is your primary focus?
            </h1>
<p class="font-body text-on-surface-variant text-lg max-w-md mx-auto leading-relaxed">
                Choose the nutritional path that aligns with your current lifestyle goals.
            </p>
</div>
<!-- Bento Selection Grid -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-4 w-full">
<!-- Option: Vegan (Unselected State) -->
<button class="glass-panel group relative flex flex-col items-center justify-center p-8 rounded-xl border border-outline-variant/10 hover:border-primary-container/30 transition-all duration-300 active:scale-95">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center mb-4 group-hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-colors" data-icon="leafy_green">energy_savings_leaf</span>
</div>
<span class="font-headline text-lg font-bold text-on-surface">Vegan</span>
</button>
<!-- Option: Keto (Selected State) -->
<button class="relative flex flex-col items-center justify-center p-8 rounded-xl bg-primary-container text-on-primary-container selected-glow border border-primary-container/50 transition-all duration-300 scale-105 z-10">
<div class="w-12 h-12 rounded-full bg-on-primary-container/10 flex items-center justify-center mb-4">
<span class="material-symbols-outlined" data-icon="egg" style="font-variation-settings: 'FILL' 1;">egg</span>
</div>
<span class="font-headline text-lg font-bold">Keto</span>
<div class="absolute -top-2 -right-2 bg-on-primary-container text-primary-container rounded-full p-1 shadow-lg">
<span class="material-symbols-outlined text-sm block" data-icon="check">check</span>
</div>
</button>
<!-- Option: Paleo -->
<button class="glass-panel group relative flex flex-col items-center justify-center p-8 rounded-xl border border-outline-variant/10 hover:border-primary-container/30 transition-all duration-300 active:scale-95">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center mb-4 group-hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-colors" data-icon="restaurant">restaurant</span>
</div>
<span class="font-headline text-lg font-bold text-on-surface">Paleo</span>
</button>
<!-- Option: Mediterranean -->
<button class="glass-panel group relative flex flex-col items-center justify-center p-8 rounded-xl border border-outline-variant/10 hover:border-primary-container/30 transition-all duration-300 active:scale-95">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center mb-4 group-hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-colors" data-icon="set_meal">set_meal</span>
</div>
<span class="font-headline text-lg font-bold text-on-surface text-center">Mediterranean</span>
</button>
<!-- Option: High Protein -->
<button class="glass-panel group relative flex flex-col items-center justify-center p-8 rounded-xl border border-outline-variant/10 hover:border-primary-container/30 transition-all duration-300 active:scale-95">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center mb-4 group-hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-colors" data-icon="fitness_center">fitness_center</span>
</div>
<span class="font-headline text-lg font-bold text-on-surface">Muscle Gain</span>
</button>
<!-- Option: Balanced -->
<button class="glass-panel group relative flex flex-col items-center justify-center p-8 rounded-xl border border-outline-variant/10 hover:border-primary-container/30 transition-all duration-300 active:scale-95">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center mb-4 group-hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-colors" data-icon="balance">balance</span>
</div>
<span class="font-headline text-lg font-bold text-on-surface">Balanced</span>
</button>
</div>
</main>
<!-- Footer Action -->
<footer class="fixed bottom-0 left-0 w-full p-8 md:p-12 flex flex-col items-center justify-center bg-gradient-to-t from-surface via-surface/80 to-transparent">
<button class="w-full max-w-md py-5 bg-primary-container text-on-primary-container rounded-full font-headline text-lg font-black tracking-wide shadow-[0_10px_40px_rgba(0,255,127,0.3)] hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center gap-3">
            Continue
            <span class="material-symbols-outlined font-bold" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="mt-6 text-on-surface-variant/50 text-xs font-label uppercase tracking-widest">
            You can change this later in settings
        </p>
</footer>
<!-- Background Decoration -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-20">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-container/20 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary-container/10 blur-[100px] rounded-full"></div>
</div>
</body></html>
