<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed-variant": "#004c69",
              "on-error-container": "#ffdad6",
              "surface-bright": "#393939",
              "surface": "#131313",
              "secondary-fixed-dim": "#7ad0ff",
              "on-error": "#690005",
              "secondary-container": "#00bdfd",
              "surface-container": "#201f1f",
              "background": "#0A0A0A",
              "on-secondary-container": "#004964",
              "inverse-surface": "#e5e2e1",
              "tertiary-fixed-dim": "#e6c26c",
              "tertiary-fixed": "#ffdf95",
              "primary-fixed": "#63ff93",
              "tertiary-container": "#ffda81",
              "outline": "#849584",
              "error-container": "#93000a",
              "error": "#ffb4ab",
              "on-primary": "#003917",
              "on-secondary": "#003549",
              "primary-fixed-dim": "#00e471",
              "surface-variant": "#353534",
              "surface-container-high": "#2a2a2a",
              "on-primary-fixed-variant": "#005224",
              "on-primary-fixed": "#00210b",
              "on-surface": "#e5e2e1",
              "surface-dim": "#131313",
              "secondary-fixed": "#c3e8ff",
              "on-tertiary": "#3e2e00",
              "on-background": "#e5e2e1",
              "on-tertiary-container": "#795e0f",
              "surface-container-highest": "#353534",
              "on-surface-variant": "#b9cbb8",
              "on-tertiary-fixed-variant": "#594400",
              "on-secondary-fixed": "#001e2c",
              "outline-variant": "#3b4b3c",
              "tertiary": "#fffaf6",
              "primary": "#f0ffed",
              "secondary": "#8bd5ff",
              "primary-container": "#00ff7f",
              "on-tertiary-fixed": "#251a00",
              "surface-container-low": "#1c1b1b",
              "inverse-primary": "#006d33",
              "surface-tint": "#00e471",
              "inverse-on-surface": "#313030",
              "surface-container-lowest": "#0e0e0e",
              "on-primary-container": "#007134"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1.25rem", "lg": "2.5rem", "xl": "4rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .glass-panel {
            background: rgba(32, 31, 31, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }
        .glow-radial {
            background: radial-gradient(circle at center, rgba(0, 255, 127, 0.08) 0%, transparent 70%);
        }
    </style>
</head>
<body class="bg-background font-body text-on-surface min-h-screen flex items-center justify-center overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Ambient Glow -->
<div class="fixed inset-0 z-0 flex items-center justify-center pointer-events-none">
<div class="w-[1000px] h-[1000px] glow-radial rounded-full"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md px-6 py-12 flex flex-col items-center">
<!-- Premium Central Glass Panel -->
<div class="glass-panel w-full border border-white/5 rounded-[2.5rem] p-10 md:p-12 shadow-[0_32px_64px_-16px_rgba(0,0,0,0.5)] flex flex-col items-center">
<!-- Brand & Header Section -->
<div class="mb-10 flex flex-col items-center text-center">
<div class="w-14 h-14 bg-primary-container rounded-2xl flex items-center justify-center mb-6 shadow-[0_0_40px_rgba(0,255,127,0.15)]">
<span class="material-symbols-outlined text-on-primary-container text-3xl" data-icon="auto_awesome">auto_awesome</span>
</div>
<h1 class="font-headline text-3xl md:text-4xl font-extrabold tracking-tight text-white leading-tight">
                    Unlock Your Health
                </h1>
<p class="mt-4 font-body text-sm text-on-surface-variant/80 max-w-[280px] leading-relaxed">
                    Personalized vitality intelligence powered by Nutrinfo AI.
                </p>
</div>
<!-- Main SSO Flow -->
<div class="w-full space-y-3.5 mb-8">
<!-- Apple SSO -->
<button class="w-full group relative flex items-center justify-center gap-3 h-14 bg-white text-black rounded-full font-bold text-base hover:bg-zinc-200 transition-all duration-300">
<span class="material-symbols-outlined text-xl" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
<span>Continue with Apple</span>
</button>
<!-- Google SSO -->
<button class="w-full group relative flex items-center justify-center gap-3 h-14 bg-white/5 border border-white/10 text-white rounded-full font-bold text-base hover:bg-white/10 transition-all duration-300">
<div class="w-5 h-5 flex items-center justify-center">
<svg class="w-full h-full" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</div>
<span>Continue with Google</span>
</button>
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-white/10"></div>
<span class="font-label text-[9px] tracking-[0.2em] uppercase text-on-surface-variant/40">OR</span>
<div class="h-[1px] flex-1 bg-white/10"></div>
</div>
<!-- Email Link -->
<button class="w-full flex items-center justify-center gap-2 h-12 text-on-surface-variant/70 hover:text-primary transition-colors font-semibold text-sm">
<span class="material-symbols-outlined text-lg" data-icon="mail">mail</span>
                    Continue with email
                </button>
</div>
<!-- Subtle Badges -->
<div class="w-full grid grid-cols-2 gap-3 pt-6 border-t border-white/5">
<div class="flex flex-col items-center gap-1.5 opacity-60">
<span class="material-symbols-outlined text-secondary-container text-base" data-icon="verified_user">verified_user</span>
<span class="text-[10px] font-semibold text-on-surface tracking-wide uppercase">Privacy First</span>
</div>
<div class="flex flex-col items-center gap-1.5 opacity-60">
<span class="material-symbols-outlined text-primary-container text-base" data-icon="bolt">bolt</span>
<span class="text-[10px] font-semibold text-on-surface tracking-wide uppercase">Instant Access</span>
</div>
</div>
</div>
<!-- Footer Action -->
<div class="mt-10 text-center">
<a class="inline-flex items-center gap-2 font-label text-[10px] tracking-[0.15em] uppercase text-on-surface-variant/60 hover:text-white transition-all group" href="#">
                Apply as a Verified Expert
                <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</a>
</div>
</main>
<!-- Grainy Texture Overlay -->
<div class="fixed inset-0 pointer-events-none z-50 opacity-[0.03] bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]"></div>
</body></html>
