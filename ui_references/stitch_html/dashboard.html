</div>
</section>
<!-- Recent Scans Carousel (Moved Higher) -->

<div class="flex gap-4 overflow-x-auto pb-4 scrollbar-hide snap-x">

<span class="material-symbols-outlined text-[14px]" data-icon="check_circle">check_circle</span>

</div>

<div class="w-12 h-12 rounded-xl bg-surface-container-highest flex items-center justify-center overflow-hidden">

</div>
<div class="w-8 h-8 rounded-full bg-error text-on-error flex items-center justify-center font-bold text-xs">
                        2.4
                    </div>
</div>

<p class="text-on-surface-variant text-[10px] mb-3">Citrus Rush · 16 fl oz</p>
<div class="flex items-center gap-1.5 text-[9px] font-bold text-error uppercase tracking-tight">
<span class="material-symbols-outlined text-[14px]" data-icon="warning">warning</span>

</div>
</div>
</section>
<!-- Shrunken Trending Swap Hero (Minimalist Glassmorphism) -->

<div class="flex items-center justify-between mb-4">
<h2 class="font-headline text-lg font-bold tracking-tight">Trending Swap</h2>

</div>
<div class="text-center">
<p class="text-[10px] text-primary-container font-semibold mb-1">Oats</p>
<span class="text-xs font-bold text-primary-container">9.2</span>
</div>
</div>
</div>
</section>
